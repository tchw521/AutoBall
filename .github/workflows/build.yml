name: Build AutoBall

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      use_rhino:
        description: '无 NDK 时改用纯 Java 引擎逃生口'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [ rhino, quickjs ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK，这里只补齐缺失组件，不使用 setup-android（在 24.04 上会失败）
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Install NDK (quickjs only)
        if: matrix.engine == 'quickjs'
        run: |
          sdkmanager --install "ndk;26.3.11579264" || true
          sdkmanager --install "cmake;3.22.1" || true

      - name: Fetch QuickJS source (best-effort)
        if: matrix.engine == 'quickjs'
        run: bash scripts/fetch_quickjs.sh

      - name: Fetch Shizuku AIDL (best-effort)
        run: bash scripts/fetch_shizuku_aidl.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: |
          if [ "${{ matrix.engine }}" = "rhino" ]; then
            gradle :app:assembleDebug -PuseRhino=true --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ "${{ matrix.engine }}" = "rhino" ]; then
            gradle :app:assembleRelease -PuseRhino=true --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Report APK size
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || echo "无 APK 产物"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoball-${{ matrix.engine }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
