name: Build AutoBall

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      use_rhino:
        description: '无 NDK 时改用纯 Java 引擎逃生口'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [ rhino, quickjs ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK，这里只补齐缺失组件，不使用 setup-android（在 24.04 上会失败）
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true

      - name: Install NDK (quickjs only)
        if: matrix.engine == 'quickjs'
        run: |
          sdkmanager --install "ndk;26.3.11579264" || true
          sdkmanager --install "cmake;3.22.1" || true

      - name: Fetch QuickJS source (best-effort)
        if: matrix.engine == 'quickjs'
        run: bash scripts/fetch_quickjs.sh

      - name: Fetch Shizuku AIDL (best-effort)
        run: bash scripts/fetch_shizuku_aidl.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        id: dbg
        continue-on-error: true
        run: |
          rm -f debug-failed
          if [ "${{ matrix.engine }}" = "rhino" ]; then
            gradle :app:assembleDebug -PuseRhino=true --stacktrace > build-debug.log 2>&1
          else
            gradle :app:assembleDebug --stacktrace > build-debug.log 2>&1
          fi
          code=$?
          echo "---- 末尾日志 ----"
          tail -n 80 build-debug.log || true
          echo "---- APK 产物 ----"
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true
          if [ $code -ne 0 ]; then touch debug-failed; echo "DEBUG_BUILD_FAILED"; fi
          exit 0

      - name: 回传构建诊断（Issue）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/ci_report.py build-debug.log "debug-${{ matrix.engine }}" || echo "report failed"

      - name: Build Release APK
        id: rel
        continue-on-error: true
        run: |
          rm -f release-failed
          if [ "${{ matrix.engine }}" = "rhino" ]; then
            gradle :app:assembleRelease -PuseRhino=true --stacktrace > build-release.log 2>&1
          else
            gradle :app:assembleRelease --stacktrace > build-release.log 2>&1
          fi
          code=$?
          echo "---- 末尾日志 ----"
          tail -n 80 build-release.log || true
          echo "---- APK 产物 ----"
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true
          if [ $code -ne 0 ]; then touch release-failed; echo "RELEASE_BUILD_FAILED"; fi
          exit 0

      - name: 回传 Release 诊断（Issue）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/ci_report.py build-release.log "release-${{ matrix.engine }}" || echo "report failed"

      - name: 校验构建结果
        if: always()
        run: |
          if [ -f debug-failed ] || [ -f release-failed ]; then
            echo "构建失败：见上方的末尾日志"
            exit 1
          fi
          n=$(find app/build/outputs/apk -name '*.apk' | wc -l)
          echo "APK 数量: $n"
          if [ "$n" -eq 0 ]; then echo "未产出 APK"; exit 1; fi

      - name: Report APK size
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || echo "无 APK 产物"

      - name: 入库 APK 到 apk 分支
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE: ${{ matrix.engine }}
        run: python3 .github/publish_apk.py app/build/outputs/apk || echo "apk 入库失败"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoball-${{ matrix.engine }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
